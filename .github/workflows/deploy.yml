name: CI/CD Pipeline

on:
  push:
    branches:
      - master2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin
      
      - name: Give mvnw permission
        working-directory: ./JtProject
        run: chmod +x mvnw

      - name: Build Maven project
        working-directory: ./JtProject
        run: ./mvnw clean package -DskipTests

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: mahfooz0509
          password: Mahi.ma118

      - name: Build and push Docker image
        working-directory: ./JtProject
        run: |
          docker build -t mahfooz0509/jtproject:latest .
          docker push mahfooz0509/jtproject:latest

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install jtproject ./jtproject-chart \
            --set image.repository=<dockerhub-username>/jtproject \
            --set image.tag=latest
